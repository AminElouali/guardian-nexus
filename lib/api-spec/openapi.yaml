openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspaces
    description: Tenant workspaces and their members
  - name: assets
    description: Organization-owned assets
  - name: integrations
    description: Tenant-consented cloud and identity providers
  - name: ai-evaluations
    description: Explicitly simulated, tenant-scoped AI safety test runs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /plans:
    get:
      operationId: listPlans
      tags: [workspaces]
      summary: List subscription plans
      responses:
        "200":
          description: Available plans and usage limits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces accessible to the signed-in user
      responses:
        "200":
          description: User workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace and make the creator its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Invalid input or plan limit
  /workspaces/{workspaceId}/dashboard:
    get:
      operationId: getWorkspaceDashboard
      tags: [workspaces]
      summary: Get workspace security overview and usage
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Security overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "403":
          description: User is not a workspace member
  /workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      tags: [workspaces]
      summary: List members of a workspace
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "403":
          description: User is not a workspace member
  /workspaces/{workspaceId}/members/{membershipId}:
    patch:
      operationId: updateWorkspaceMember
      tags: [workspaces]
      summary: Change a member role
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: membershipId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          description: Owner role required
  /workspaces/{workspaceId}/assets:
    get:
      operationId: listWorkspaceAssets
      tags: [assets]
      summary: List assets in a workspace
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "403":
          description: User is not a workspace member
    post:
      operationId: createWorkspaceAsset
      tags: [assets]
      summary: Add an asset to a workspace
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "403":
          description: User is not allowed to add assets
        "409":
          description: Plan asset limit reached
  /workspaces/{workspaceId}/assets/{assetId}:
    delete:
      operationId: deleteWorkspaceAsset
      tags: [assets]
      summary: Remove an asset from a workspace
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
        - in: path
          name: assetId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Asset removed
        "403":
          description: User is not allowed to remove assets
        "404":
          description: Asset not found
  /oauth/microsoft/callback:
    get:
      operationId: microsoftOAuthCallback
      tags: [integrations]
      summary: Complete Microsoft OAuth consent
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Consent recorded
          content:
            text/plain:
              schema: { type: string }
        "400":
          description: Invalid, expired, or declined consent
        "403":
          description: Workspace access denied
  /workspaces/{workspaceId}/integrations:
    get:
      operationId: listWorkspaceIntegrations
      tags: [integrations]
      summary: List provider connections for a workspace
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tenant-scoped provider connection status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationConnection" }
        "403":
          description: User is not a workspace member
  /workspaces/{workspaceId}/integration-readiness:
    get:
      operationId: getWorkspaceIntegrations
      tags: [integrations]
      summary: List locally prepared integration setup records
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Setup records and provider prerequisites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceIntegrationsResponse" }
        "403":
          description: User is not a workspace member
  /workspaces/{workspaceId}/integrations/microsoft/setup:
    post:
      operationId: prepareMicrosoftIntegration
      tags: [integrations]
      summary: Record Microsoft tenant setup before OAuth consent
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicrosoftIntegrationSetupInput" }
      responses:
        "200":
          description: Existing setup returned idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceIntegration" }
        "201":
          description: Setup recorded; OAuth consent was not initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceIntegration" }
        "403":
          description: Workspace owner role required
  /workspaces/{workspaceId}/integrations/aws/setup:
    post:
      operationId: prepareAwsIntegration
      tags: [integrations]
      summary: Generate an ExternalId for AWS role setup
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AwsIntegrationSetupInput" }
      responses:
        "200":
          description: Existing setup returned idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceIntegration" }
        "201":
          description: ExternalId generated; STS was not called
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceIntegration" }
        "403":
          description: Workspace owner role required
  /workspaces/{workspaceId}/integrations/{integrationId}/revoke:
    post:
      operationId: revokeWorkspaceIntegrationPreparation
      tags: [integrations]
      summary: Revoke a local integration preparation record
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: integrationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Local preparation record revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceIntegration" }
        "403":
          description: Workspace owner role required
        "404":
          description: Integration preparation not found
  /workspaces/{workspaceId}/integrations/microsoft/authorize:
    post:
      operationId: beginMicrosoftAuthorization
      tags: [integrations]
      summary: Start Microsoft OAuth after explicit user action
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Microsoft authorization URL and minimum read scopes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicrosoftAuthorizationResult" }
        "403":
          description: Workspace owner or admin role required
        "503":
          description: Microsoft OAuth is not configured
  /workspaces/{workspaceId}/integrations/aws:
    post:
      operationId: configureAwsIntegration
      tags: [integrations]
      summary: Prepare an AWS cross-account role with a generated ExternalId
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AwsIntegrationInput" }
      responses:
        "201":
          description: Role trust setup instructions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsIntegrationSetup" }
        "400":
          description: Invalid AWS role ARN
        "403":
          description: Workspace owner or admin role required
        "503":
          description: AWS workload identity or trust principal is not configured
  /workspaces/{workspaceId}/integrations/aws/verify:
    post:
      operationId: verifyAwsIntegration
      tags: [integrations]
      summary: Verify the read-only role with a 900-second STS session
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cross-account role verified; no scan was started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsIntegrationVerification" }
        "403":
          description: Workspace owner or admin role required
        "404":
          description: Pending AWS role configuration not found
        "429":
          description: Provider rate limit reached; retry after the Retry-After header
        "503":
          description: AWS workload identity is not configured
  /workspaces/{workspaceId}/integrations/{provider}:
    delete:
      operationId: revokeWorkspaceIntegration
      tags: [integrations]
      summary: Disable a provider connection for this workspace
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [microsoft_graph, aws] }
      responses:
        "204":
          description: Local provider access disabled
        "403":
          description: Workspace owner or admin role required
        "404":
          description: Provider connection not found
  /workspaces/{workspaceId}/ai-evaluations:
    get:
      operationId: listWorkspaceAiEvaluations
      tags: [ai-evaluations]
      summary: List tenant-scoped AI mock evaluation history
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Latest safe summaries; raw prompts and responses are not stored
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiEvaluationRun" }
        "403":
          description: User is not a workspace member
  /workspaces/{workspaceId}/ai-evaluations/mock:
    post:
      operationId: runWorkspaceMockAiEvaluation
      tags: [ai-evaluations]
      summary: Run a bounded local mock evaluation
      description: Runs only Guardian Nexus deterministic mock fixtures; this does not invoke NVIDIA garak or a customer agent.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Simulated evaluation recorded in this workspace audit trail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiEvaluationRun" }
        "403":
          description: Workspace owner or admin role required
        "409":
          description: Workspace monthly scan quota reached
        "429":
          description: Evaluation slot is occupied; retry shortly
  /workspaces/{workspaceId}/ai-security-assessments/lab/availability:
    get:
      operationId: getWorkspaceAiAssessmentLabAvailability
      tags: [ai-evaluations]
      summary: Check whether the isolated local laboratory worker is ready
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Development-only worker readiness; no assessment is started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAssessmentLabAvailability" }
        "403":
          description: User is not a workspace member
  /workspaces/{workspaceId}/ai-security-assessments/lab/jobs:
    get:
      operationId: listWorkspaceAiAssessmentLabJobs
      tags: [ai-evaluations]
      summary: List tenant-scoped laboratory assessments and evidence summaries
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Latest safe results and durable job states for this workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiAssessmentLabJob" }
        "403":
          description: User is not a workspace member
    post:
      operationId: createWorkspaceAiAssessmentLabJob
      tags: [ai-evaluations]
      summary: Request a bounded evaluation of Guardian Nexus's local lab agent
      description: Runs only the fixed, owned loopback laboratory profile; arbitrary targets, customer data, credentials, and paid models are not accepted.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAssessmentLabJobRequest" }
      responses:
        "202":
          description: Durable tenant-scoped job accepted or existing idempotent job returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAssessmentLabJob" }
        "403":
          description: Workspace owner or admin role required
        "409":
          description: Workspace quota or pending job limit reached
        "429":
          description: Local worker concurrency limit reached
        "503":
          description: Local isolated Docker worker is unavailable or disabled outside development
  /workspaces/{workspaceId}/ai-security-assessments/lab/jobs/{jobId}/retry:
    post:
      operationId: retryWorkspaceAiAssessmentLabJob
      tags: [ai-evaluations]
      summary: Retry a failed tenant-scoped laboratory job within its attempt limit
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: The existing durable job was queued for one bounded retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAssessmentLabJob" }
        "403":
          description: Workspace owner or admin role required
        "404":
          description: Job not found in this workspace
        "409":
          description: Job is not retryable or has exhausted its attempt limit
        "503":
          description: Local isolated Docker worker is unavailable or disabled outside development
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        maxAssets: { type: integer }
        maxUsers: { type: integer }
        scansPerMonth: { type: integer }
        tokensPerMonth: { type: integer }
        apiRequestsPerMonth: { type: integer }
        support: { type: string }
      required: [id, name, maxAssets, maxUsers, scansPerMonth, tokensPerMonth, apiRequestsPerMonth, support]
    Workspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        planId: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, planId, role, createdAt]
    WorkspaceInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        planId: { type: string, enum: [small, medium, large] }
      required: [name, planId]
    Dashboard:
      type: object
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        plan: { $ref: "#/components/schemas/Plan" }
        assetCount: { type: integer }
        memberCount: { type: integer }
        findingsCount: { type: integer }
        scansUsed: { type: integer }
        tokensUsed: { type: integer }
        apiRequestsUsed: { type: integer }
        recentAssets:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
      required: [workspace, plan, assetCount, memberCount, findingsCount, scansUsed, tokensUsed, apiRequestsUsed, recentAssets]
    Member:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        role: { type: string, enum: [owner, admin, analyst, viewer] }
        createdAt: { type: string, format: date-time }
      required: [id, userId, role, createdAt]
    MemberRoleInput:
      type: object
      properties:
        role: { type: string, enum: [admin, analyst, viewer] }
      required: [role]
    Asset:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        environment: { type: string }
        criticality: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, type, environment, criticality, createdAt]
    AssetInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        type: { type: string, enum: [cloud, endpoint, application, identity, network, other] }
        environment: { type: string, enum: [production, staging, development, unknown] }
        criticality: { type: string, enum: [critical, high, medium, low] }
      required: [name, type, environment, criticality]
    IntegrationConnection:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [microsoft_graph, aws] }
        status: { type: string, enum: [pending, active, revoked] }
        externalTenantId: { type: ["string", "null"] }
        awsAccountId: { type: ["string", "null"] }
        awsRoleArn: { type: ["string", "null"] }
        grantedScopes:
          type: array
          items: { type: string }
        consentedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, provider, status, externalTenantId, awsAccountId, awsRoleArn, grantedScopes, consentedAt, revokedAt, updatedAt]
    MicrosoftAuthorizationResult:
      type: object
      properties:
        authorizationUrl: { type: string, format: uri }
        scopes:
          type: array
          items: { type: string }
      required: [authorizationUrl, scopes]
    AwsIntegrationInput:
      type: object
      properties:
        roleArn: { type: string, minLength: 20, maxLength: 600 }
      required: [roleArn]
    AwsIntegrationSetup:
      type: object
      properties:
        connectionId: { type: string, format: uuid }
        accountId: { type: string, pattern: "^[0-9]{12}$" }
        roleArn: { type: string }
        externalId: { type: string }
        trustedPrincipalArn: { type: ["string", "null"] }
        trustPolicyJson: { type: string }
        sessionDurationSeconds: { type: integer, enum: [900] }
        requiredPolicy: { type: string }
        instructions: { type: string }
      required: [connectionId, accountId, roleArn, externalId, trustedPrincipalArn, trustPolicyJson, sessionDurationSeconds, requiredPolicy, instructions]
    AwsIntegrationVerification:
      type: object
      properties:
        status: { type: string, enum: [active] }
        accountId: { type: string, pattern: "^[0-9]{12}$" }
        roleArn: { type: string }
        sessionDurationSeconds: { type: integer, enum: [900] }
        message: { type: string }
      required: [status, accountId, roleArn, sessionDurationSeconds, message]
    MicrosoftIntegrationSetupInput:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
      required: [tenantId]
    AwsIntegrationSetupInput:
      type: object
      properties:
        accountId: { type: string, pattern: "^[0-9]{12}$" }
      required: [accountId]
    WorkspaceIntegration:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [microsoft, aws] }
        externalAccountId: { type: string }
        status:
          type: string
          enum:
            - awaiting_app_registration
            - ready_for_admin_consent
            - awaiting_runtime_identity
            - ready_for_role_trust
            - connected
            - revoked
        externalId: { type: ["string", "null"] }
        requestedPermissions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
      required: [id, provider, externalAccountId, status, externalId, requestedPermissions, createdAt, revokedAt]
    IntegrationProviderReadiness:
      type: object
      properties:
        microsoftAppRegistrationConfigured: { type: boolean }
        microsoftPermissions:
          type: array
          items: { type: string }
        awsRuntimePrincipalConfigured: { type: boolean }
        liveConnectionsVerified: { type: boolean }
      required: [microsoftAppRegistrationConfigured, microsoftPermissions, awsRuntimePrincipalConfigured, liveConnectionsVerified]
    WorkspaceIntegrationsResponse:
      type: object
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceIntegration" }
        readiness: { $ref: "#/components/schemas/IntegrationProviderReadiness" }
      required: [connections, readiness]
    AiEvaluationCheck:
      type: object
      properties:
        checkId: { type: string }
        category: { type: string }
        status: { type: string, enum: [passed, failed] }
        reasonCode: { type: string }
      required: [checkId, category, status, reasonCode]
    AiEvaluationRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        engine: { type: string, enum: [guardian_mock] }
        execution: { type: string, enum: [simulated] }
        version: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/AiEvaluationCheck" }
        passedChecks: { type: integer }
        failedChecks: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, engine, execution, version, checks, passedChecks, failedChecks, createdAt]
    AiAssessmentLabAvailability:
      type: object
      properties:
        status: { type: string, enum: [ready, unavailable, disabled] }
        workerVersion: { type: string }
        reasonCode: { type: ["string", "null"] }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/AiAssessmentLabProfileAvailability" }
      required: [status, workerVersion, reasonCode, profiles]
    AiAssessmentLabProfileAvailability:
      type: object
      properties:
        profileId:
          type: string
          enum: [guardian-local-agent-v1, guardian-local-llm-qwen3-0.6b-v1]
        engine: { type: string, enum: [garak, local_llm_lab] }
        status: { type: string, enum: [ready, unavailable, disabled] }
        reasonCode: { type: ["string", "null"] }
      required: [profileId, engine, status, reasonCode]
    AiAssessmentLabJobRequest:
      type: object
      properties:
