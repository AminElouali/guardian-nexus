        engine: { type: string, const: guardian_verification }
        version: { type: string }
        suiteVersion: { type: string }
        agentVersion: { type: string }
        policyVersion: { type: string }
        oracleVersion: { type: string }
        mode: { type: string, enum: [deterministic_synthetic_local_agent] }
        objectiveBitOrder:
