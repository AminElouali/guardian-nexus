[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-nexus-sdk"
version = "0.1.0"
description = "Dependency-free Python client for Guardian Nexus laboratory APIs"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
